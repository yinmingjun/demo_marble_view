<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entry - Marble View</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    @keyframes circleReveal {
      from {
        clip-path: circle(0% at 50% 50%);
      }
      to {
        clip-path: circle(150% at 50% 50%);
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f7;
      padding: 24px;
    }

    .image-frame {
      position: relative;
      width: 100%;
      max-height: calc(100vh - 48px);
      aspect-ratio: 7 / 5;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      animation: circleReveal 3s ease-in both;
    }

    .image-frame img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .zone {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--w);
      height: var(--h);
      display: block;
      text-decoration: none;
      background: transparent;
      border: 2px solid transparent;
      transition: background 0.2s ease, border-color 0.2s ease;
      cursor: pointer;
    }

    .zone:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.5);
    }

    .image-frame.debug .zone {
      background: rgba(255, 59, 48, 0.12);
      border-color: #ff3b30;
    }

    .image-frame.debug .zone::after {
      content: attr(data-coord);
      position: absolute;
      top: 4px;
      left: 4px;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 2px 6px;
      font-size: 11px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      border-radius: 3px;
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="image-frame">
    <img src="images/entry.png" alt="Entry">
    <a class="zone"
       data-coord="x:48% y:11% w:12% h:20% → 走近太阳"
       style="--x: 52%; --y: 11%; --w: 12%; --h: 20%;"
       href="entry_detail1.html"
       title="走近太阳 - Approaching the Sun"></a>
    <a class="zone"
       data-coord="x:66% y:36% w:14% h:19% → 宇宙之眼"
       style="--x: 66%; --y: 36%; --w: 14%; --h: 19%;"
       href="entry_detail2.html"
       title="宇宙之眼 - Eye of the Cosmos"></a>
    <a class="zone"
       data-coord="x:40% y:59% w:14% h:19% → 火星探秘"
       style="--x: 40%; --y: 59%; --w: 14%; --h: 19%;"
       href="entry_detail3.html"
       title="火星探秘 - Mars Exploration"></a>
  </div>
  <script>
    if (new URLSearchParams(location.search).has('debug')) {
      document.querySelector('.image-frame').classList.add('debug');
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>详情 1 - Marble View</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    @keyframes circleReveal {
      from {
        clip-path: circle(0% at 50% 50%);
      }
      to {
        clip-path: circle(150% at 50% 50%);
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f7;
      padding: 24px;
    }

    .image-frame {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: calc(100vh - 48px);
      max-width: 100%;
      max-height: calc(100vh - 48px);
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      animation: circleReveal 3s ease-in both;
    }

    .image-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-wrap img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .action-bar {
      display: flex;
      flex-direction: row;
      height: 64px;
      flex-shrink: 0;
      background: #fafafa;
      border-top: 1px solid #e5e5e7;
    }

    .action-bar a {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #1d1d1f;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: background 0.15s ease;
    }

    .action-bar a:hover {
      background: #efefef;
    }

    .action-bar a:active {
      background: #e5e5e7;
    }
    .home-link {
      position: fixed;
      top: 16px;
      left: 16px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      color: #fff;
      text-decoration: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 1000;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .home-link:hover {
      background: rgba(0, 0, 0, 0.6);
      transform: scale(1.05);
    }

    .home-link:active {
      transform: scale(0.95);
    }

    .home-link svg {
      width: 20px;
      height: 20px;
    }
  </style>
</head>
<body>
  <a class="home-link" href="../index.html" title="回到首页" aria-label="Home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1V9.5z"/>
    </svg>
  </a>
  <div class="image-frame">
    <div class="image-wrap">
      <img src="../images/entry_detail1.png" alt="详情 1">
    </div>
    <nav class="action-bar">
      <a href="entry.html">返回</a>
    </nav>
  </div>
</body>
</html>

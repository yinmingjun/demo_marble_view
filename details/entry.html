<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entry - Marble View</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f7;
      padding: 24px;
    }

    .image-frame {
      position: relative;
      width: 100%;
      max-height: calc(100vh - 48px);
      aspect-ratio: 7 / 5;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    .entrance-video,
    .final-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .entrance-video {
      z-index: 1;
      opacity: 1;
      transition: opacity 0.6s ease;
    }

    .final-image {
      z-index: 0;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    .image-frame.video-ended .entrance-video {
      opacity: 0;
    }

    .image-frame.video-ended .final-image {
      opacity: 1;
    }

    .video-mask {
      position: absolute;
      left: 0;
      right: 0;
      height: 8%;
      background: #000;
      z-index: 2;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    .video-mask-top { top: 0; }
    .video-mask-bottom { bottom: 0; }

    .image-frame.video-ended .video-mask {
      opacity: 0;
    }

    .zone {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--w);
      height: var(--h);
      display: block;
      text-decoration: none;
      background: transparent;
      border: 2px solid transparent;
      transition: background 0.2s ease, border-color 0.2s ease;
      pointer-events: none;
      z-index: 3;
    }

    .image-frame.video-ended .zone {
      pointer-events: auto;
    }

    .zone:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.5);
    }

    .image-frame.debug .zone {
      background: rgba(255, 59, 48, 0.12);
      border-color: #ff3b30;
    }

    .image-frame.debug .zone::after {
      content: attr(data-coord);
      position: absolute;
      top: 4px;
      left: 4px;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 2px 6px;
      font-size: 11px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      border-radius: 3px;
      pointer-events: none;
      white-space: nowrap;
    }

    .floating-texts {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      overflow: hidden;
    }

    .floating-text {
      position: absolute;
      color: rgba(255, 255, 255, 0.45);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.5px;
      white-space: nowrap;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-shadow: 0 0 6px rgba(0, 0, 0, 0.7);
      animation: drift var(--dur, 20s) ease-in-out var(--delay, 0s) infinite;
    }

    @keyframes drift {
      0%, 100% { transform: translate(0, 0); }
      25%      { transform: translate(12px, -8px); }
      50%      { transform: translate(-8px, 12px); }
      75%      { transform: translate(8px, 6px); }
    }

    .floating-text.clickable {
      pointer-events: auto;
      cursor: pointer;
      text-decoration: none;
      transition: text-shadow 0.2s ease, transform 0.2s ease, font-size 0.2s ease;
    }

    .floating-text.clickable:hover {
      font-size: 15px;
      text-shadow: 0 0 12px currentColor, 0 0 6px rgba(0, 0, 0, 0.7);
      transform: translate(0, 0) scale(1.08);
    }

    .floating-text .ft-sub {
      display: block;
      font-size: 0.7em;
      color: #fff;
      font-weight: 700;
      letter-spacing: 1px;
      margin-top: 2px;
    }
  </style>
</head>

  <script>
    if (new URLSearchParams(location.search).has('debug')) {
      document.querySelector('.image-frame').classList.add('debug');
    }

    var video = document.querySelector('.entrance-video');
    var frame = document.querySelector('.image-frame');

    function showFinal() {
      frame.classList.add('video-ended');
    }

    video.addEventListener('error', showFinal);

    setTimeout(function () {
      video.pause();
      showFinal();
    }, 5000);
  </script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>走近太阳 - Marble View</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    @keyframes blindOpen {
      from { transform: rotateX(0deg); }
      to   { transform: rotateX(90deg); }
    }

    @keyframes blindsFadeOut {
      from { opacity: 1; }
      to   { opacity: 0; visibility: hidden; }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      padding: 24px;
    }

    .image-frame {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: calc(100vh - 48px);
      max-width: 100%;
      max-height: calc(100vh - 48px);
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    .image-wrap {
      flex: 1;
      min-height: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .blinds {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      pointer-events: none;
      perspective: 1200px;
      z-index: 2;
      animation: blindsFadeOut 0.4s ease-out 1.3s forwards;
    }

    .blind {
      flex: 1;
      background: #000;
      transform-origin: center;
      animation: blindOpen 0.6s ease-in-out forwards;
    }

    .blind:nth-child(1)  { animation-delay: 0.00s; }
    .blind:nth-child(2)  { animation-delay: 0.06s; }
    .blind:nth-child(3)  { animation-delay: 0.12s; }
    .blind:nth-child(4)  { animation-delay: 0.18s; }
    .blind:nth-child(5)  { animation-delay: 0.24s; }
    .blind:nth-child(6)  { animation-delay: 0.30s; }
    .blind:nth-child(7)  { animation-delay: 0.36s; }
    .blind:nth-child(8)  { animation-delay: 0.42s; }
    .blind:nth-child(9)  { animation-delay: 0.48s; }
    .blind:nth-child(10) { animation-delay: 0.54s; }
    .blind:nth-child(11) { animation-delay: 0.60s; }
    .blind:nth-child(12) { animation-delay: 0.66s; }

    .image-wrap a {
      display: contents;
    }

    .image-wrap img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      cursor: pointer;
    }

    .home-link {
      position: fixed;
      top: 90px;
      left: 120px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      color: #fff;
      text-decoration: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 1000;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .home-link:hover {
      background: rgba(0, 0, 0, 0.6);
      transform: scale(1.05);
    }

    .home-link:active {
      transform: scale(0.95);
    }

    .home-link svg {
      width: 20px;
      height: 20px;
    }

    .home-menu {
      position: fixed;
      top: 90px;
      left: 156px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-left: 20px;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-8px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 1000;
    }

    .home-link:hover ~ .home-menu,
    .home-menu:hover {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(0);
    }

    .home-menu a {
      display: block;
      line-height: 0;
    }

    .home-menu img {
      display: block;
      width: 150px;
      height: auto;
    }
  </style>
</head>
<body>
  <a class="home-link" aria-label="Home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1V9.5z"/>
    </svg>
  </a>
  <div class="home-menu">
    <a href="entry.html?nointro=1" aria-label="返回展厅首页">
      <img src="../images/menu_bar_home.png" alt="">
    </a>
    <a href="#" onclick="event.preventDefault(); history.back();" aria-label="返回上一级页面">
      <img src="../images/menu_bar_pre.png" alt="">
    </a>
  </div>
  <div class="image-frame">
    <div class="image-wrap">
      <a href="entry_sun_select.html" aria-label="进入走近太阳">
        <img src="../images/sun_main.jpg" alt="走近太阳">
      </a>
      <div class="blinds" aria-hidden="true">
        <div class="blind"></div>
        <div class="blind"></div>
        <div class="blind"></div>
        <div class="blind"></div>
        <div class="blind"></div>
        <div class="blind"></div>
        <div class="blind"></div>
        <div class="blind"></div>
        <div class="blind"></div>
        <div class="blind"></div>
        <div class="blind"></div>
        <div class="blind"></div>
      </div>
    </div>
  </div>
</body>
</html>

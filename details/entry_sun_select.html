<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>走近太阳 · 选择 - Marble View</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      padding: 24px;
    }

    .image-frame {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: calc(100vh - 48px);
      max-width: 100%;
      max-height: calc(100vh - 48px);
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    .image-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-wrap img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .image-stage {
      position: relative;
      aspect-ratio: 5760 / 4096;
      height: 100%;
      max-width: 100%;
    }

    .image-stage img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .hotspot {
      position: absolute;
      border: 1px solid transparent;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .hotspot:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.25);
    }

    .hotspot:active {
      background: rgba(255, 255, 255, 0.2);
    }

    .home-link {
      position: fixed;
      top: 16px;
      left: 16px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      color: #fff;
      text-decoration: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 1000;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .home-link:hover {
      background: rgba(0, 0, 0, 0.6);
      transform: scale(1.05);
    }

    .home-link:active {
      transform: scale(0.95);
    }

    .home-link svg {
      width: 20px;
      height: 20px;
    }
  </style>
</head>
<body>
  <a class="home-link" href="../index.html" title="回到首页" aria-label="Home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1V9.5z"/>
    </svg>
  </a>
  <div class="image-frame">
    <div class="image-wrap">
      <div class="image-stage">
        <img src="../images/sun_select.jpg" alt="走近太阳 · 选择">
        <a class="hotspot" href="https://marble.worldlabs.ai/worldvr/427cadea-8621-44b2-94ee-65d3d1a5b0ff" target="_blank" rel="noopener noreferrer"
           style="left: 59.5%; top: 40%; width: 16%; height: 26%;"
           aria-label="太阳如何影响地球？ / How does the Sun affect the Earth?"></a>
        <a class="hotspot" href="https://marble.worldlabs.ai/worldvr/354273b9-2b4f-408e-97b3-e9647eb8513b" target="_blank" rel="noopener noreferrer"
           style="left: 81.5%; top: 40%; width: 16%; height: 26%;"
           aria-label="太阳真的是一个静止火球吗？ / Is the Sun truly a static fireball?"></a>
      </div>
    </div>
  </div>
</body>
</html>

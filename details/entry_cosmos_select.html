<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宇宙之眼 · 选择 - Marble View</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    @keyframes circleReveal {
      from {
        clip-path: circle(0% at 50% 50%);
      }
      to {
        clip-path: circle(150% at 50% 50%);
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      padding: 24px;
    }

    .image-frame {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: calc(100vh - 48px);
      max-width: 100%;
      max-height: calc(100vh - 48px);
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      animation: circleReveal 3s ease-in both;
    }

    .image-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-stage {
      position: relative;
      aspect-ratio: 5760 / 4096;
      height: 100%;
      max-width: 100%;
    }

    .image-stage img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .hotspot {
      position: absolute;
      border: 1px solid transparent;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .hotspot:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.25);
    }

    .hotspot:active {
      background: rgba(255, 255, 255, 0.2);
    }

    .action-bar {
      display: flex;
      flex-direction: row;
      height: 64px;
      flex-shrink: 0;
      background: #fafafa;
      border-top: 1px solid #e5e5e7;
    }

    .action-bar a {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #1d1d1f;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: background 0.15s ease;
    }

    .action-bar a:hover {
      background: #efefef;
    }

    .action-bar a:active {
      background: #e5e5e7;
    }
    .home-link {
      position: fixed;
      top: 16px;
      left: 16px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      color: #fff;
      text-decoration: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 1000;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .home-link:hover {
      background: rgba(0, 0, 0, 0.6);
      transform: scale(1.05);
    }

    .home-link:active {
      transform: scale(0.95);
    }

    .home-link svg {
      width: 20px;
      height: 20px;
    }
  </style>
</head>
<body>
  <a class="home-link" href="entry.html?nointro=1" title="回到首页" aria-label="Home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1V9.5z"/>
    </svg>
  </a>
  <div class="image-frame">
    <div class="image-wrap">
      <div class="image-stage">
        <img src="../images/cosmos_select.jpg" alt="宇宙之眼 · 选择">
        <a class="hotspot" href="https://marble.worldlabs.ai/worldvr/ddce89d1-2a8a-4d2c-b9bc-c0b528676cb5" target="_blank" rel="noopener noreferrer"
           style="left: 6%; top: 22%; width: 22%; height: 24%;"
           aria-label="光学 · 可见光能让我们看见什么？ / What does visible light allow us to see?"></a>
        <a class="hotspot" href="https://marble.worldlabs.ai/worldvr/dcc8ab02-6b24-48af-ba08-4bdb944e5460" target="_blank" rel="noopener noreferrer"
           style="left: 76%; top: 32%; width: 22%; height: 24%;"
           aria-label="射电 · 没有可见光，该如何观察宇宙？ / How do we observe the universe without visible light?"></a>
        <a class="hotspot" href="https://marble.worldlabs.ai/worldvr/65262b70-8e90-4a30-b7ad-9cca5771d8ad" target="_blank" rel="noopener noreferrer"
           style="left: 10%; top: 65%; width: 22%; height: 24%;"
           aria-label="中微子 · 不发光的部分，也可以被观察到吗？ / Can the invisible parts of the cosmos be detected?"></a>
      </div>
    </div>
    <!-- <nav class="action-bar">
      <a href="entry_cosmos.html">返回</a>
    </nav> -->
  </div>
</body>
</html>
